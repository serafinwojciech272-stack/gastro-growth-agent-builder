name: GGA Autonomous Build Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: full
        type: choice
        options: [quality, build, autonomous, full]
      stage:
        description: Optional Mission Engine application stage
        required: false
        default: ''
        type: string
      force:
        description: Force autonomous execution
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gga-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAX_AUTO_RECOVERY_ATTEMPTS: 3
  MISSION_ENGINE_REPOSITORY: serafinwojciech272-stack/global-cue-sports-agent

jobs:
  precheck:
    name: Precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Repository state
        run: |
          git status --short
          git branch --show-current
          git log -5 --oneline
          test -f package.json
          test -f package-lock.json
      - name: Secret guard
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\..*)$' | grep -vE '\.env\.example$'; then exit 1; fi
          if git grep -n -E '(OPENROUTER_API_KEY|VITE_.*API_KEY|GITHUB_TOKEN)\s*[:=]' -- ':!docs/*' ':!.github/workflows/*'; then exit 1; fi

  build:
    name: Build and Quality
    needs: precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc -b --pretty false
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Tests
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then npm test; else echo 'No test script defined. Test gate skipped.'; fi
      - name: Dependency audit
        run: npm audit --audit-level=high

  agent:
    name: Mission Engine Autonomous Agent
    needs: [precheck, build, mission-engine-auth]
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'autonomous' || inputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout GGA target
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          persist-credentials: true
      - name: Checkout Mission Engine
        uses: actions/checkout@v4
        with:
          repository: serafinwojciech272-stack/global-cue-sports-agent
          ref: main
          token: ${{ secrets.MISSION_ENGINE_TOKEN }}
          path: .mission-engine
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .mission-engine/package-lock.json
      - name: Install Mission Engine
        working-directory: .mission-engine
        run: npm ci
      - name: Mission Engine identity
        working-directory: .mission-engine
        env:
          GCS_PROJECT_ID: gastro-growth-advisor
          GCS_TARGET_ROOT: ${{ github.workspace }}
          GCS_STATE_DIR: ${{ github.workspace }}/.gga/mission
          GCS_ROADMAP_FILE: ${{ github.workspace }}/.gga/mission/roadmap.json
          GCS_CONTROL_PLANE_STAGE: 2
        run: |
          npm run status
          npm run next
          npm run plan
      - name: Execute Mission Engine cycle
        working-directory: .mission-engine
        env:
          GCS_PROJECT_ID: gastro-growth-advisor
          GCS_TARGET_ROOT: ${{ github.workspace }}
          GCS_STATE_DIR: ${{ github.workspace }}/.gga/mission
          GCS_ROADMAP_FILE: ${{ github.workspace }}/.gga/mission/roadmap.json
          GCS_CONTROL_PLANE_STAGE: 2
          GGA_STAGE: ${{ inputs.stage || '' }}
          GGA_FORCE: ${{ inputs.force || false }}
        run: npm run control-plane:cycle
      - name: Revalidate target
        run: |
          npx tsc -b --pretty false
          npm run lint
          npm run build
      - name: Git safety gate
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\..*)$' | grep -vE '\.env\.example$'; then exit 1; fi
          if git diff --name-only | grep -E '(^|/)(node_modules|\.next|dist|build)(/|$)'; then exit 1; fi
          git diff --check
      - name: Commit Mission Engine changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo 'No target changes produced by Mission Engine.'; exit 0; fi
          git config user.name 'gga-mission-engine[bot]'
          git config user.email 'gga-mission-engine@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "feat: autonomous Mission Engine cycle"
          git push origin HEAD:main

  final-gate:
    name: Final Gate
    needs: [precheck, build, agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Final summary
        shell: bash
        run: |
          {
            echo '# GGA AUTONOMOUS CYCLE'
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Build job: ${{ needs.build.result }}"
            echo "Mission Engine job: ${{ needs.agent.result }}"
            echo "Recovery attempts limit: $MAX_AUTO_RECOVERY_ATTEMPTS"
            if [ '${{ needs.build.result }}' = 'success' ] && { [ '${{ needs.agent.result }}' = 'success' ] || [ '${{ needs.agent.result }}' = 'skipped' ]; }; then echo 'Result: SUCCESS'; else echo 'Result: FAILURE'; exit 1; fi
          } >> "$GITHUB_STEP_SUMMARY"
