name: GGA Autonomous Build Run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: full
        type: choice
        options: [quality, build, autonomous, full]
      stage:
        description: Optional Mission Engine application stage
        required: false
        default: ''
        type: string
      force:
        description: Force autonomous execution
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: gga-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  MAX_AUTO_RECOVERY_ATTEMPTS: 3
  MISSION_ENGINE_REPOSITORY: serafinwojciech272-stack/global-cue-sports-agent
jobs:
  mission-engine-auth:
    name: Mission Engine Auth Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate credential presence
        id: presence
        shell: bash
        env:
          ENGINE_TOKEN: ${{ secrets.MISSION_ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ENGINE_TOKEN}" ]; then
            echo 'MISSION_ENGINE_AUTH_GATE: MISSING'
            echo 'MISSION_ENGINE_TOKEN is not configured as a repository Actions secret.'
            exit 1
          fi
          echo 'MISSION_ENGINE_AUTH_GATE: PRESENT'
      - name: Validate Mission Engine repository authentication
        if: steps.presence.outcome == 'success'
        shell: bash
        env:
          ENGINE_TOKEN: ${{ secrets.MISSION_ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${MISSION_ENGINE_REPOSITORY}"
          status=$(curl -sS -o /tmp/me-repo.json -w '%{http_code}' -H "Authorization: Bearer ${ENGINE_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${url}")
          case "${status}" in
            200) echo 'MISSION_ENGINE_AUTH_GATE: AUTHENTICATION_PASS'; echo 'MISSION_ENGINE_REPOSITORY_ACCESS: PASS' ;;
            401) echo 'MISSION_ENGINE_AUTH_GATE: AUTH_FAILED (HTTP 401)'; echo 'Diagnosis: GitHub rejected the supplied credential.'; exit 1 ;;
            403) echo 'MISSION_ENGINE_AUTH_GATE: REPOSITORY_ACCESS_FAILED (HTTP 403)'; echo 'Diagnosis: credential is accepted but access to the Mission Engine repository is denied.'; exit 1 ;;
            404) echo 'MISSION_ENGINE_AUTH_GATE: REPOSITORY_ACCESS_FAILED (HTTP 404)'; echo 'Diagnosis: repository is unavailable to the supplied credential.'; exit 1 ;;
            *) echo "MISSION_ENGINE_AUTH_GATE: REQUEST_FAILED (HTTP ${status})"; echo 'Diagnosis: GitHub API returned an unexpected response.'; exit 1 ;;
          esac
      - name: Verify Mission Engine main ref
        shell: bash
        env:
          ENGINE_TOKEN: ${{ secrets.MISSION_ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${MISSION_ENGINE_REPOSITORY}/git/ref/heads/main"
          status=$(curl -sS -o /tmp/me-ref.json -w '%{http_code}' -H "Authorization: Bearer ${ENGINE_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "${url}")
          if [ "${status}" != '200' ]; then echo "MISSION_ENGINE_REF_ACCESS_FAILED: main returned HTTP ${status}"; exit 1; fi
          echo 'MISSION_ENGINE_REF_ACCESS: PASS (main)'
          echo 'MISSION_ENGINE_AUTH_GATE: PASS'
  precheck:
    name: Precheck
    needs: mission-engine-auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 5}
      - name: Repository state
        run: |
          git status --short
          git branch --show-current
          git log -5 --oneline
          test -f package.json
          test -f package-lock.json
          test -f .gga/mission/roadmap.json
          test -f .gga/mission/project-adapter.json
      - name: Secret guard
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\..*)$' | grep -vE '\.env\.example$'; then exit 1; fi
          if git grep -n -E '(OPENROUTER_API_KEY|VITE_.*API_KEY|GITHUB_TOKEN)\s*[:=]' -- ':!docs/*' ':!.github/workflows/*'; then exit 1; fi
  build:
    name: Build and Quality
    needs: precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc -b --pretty false
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Tests
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then npm test; else echo 'No test script defined. Test gate skipped.'; fi
      - name: Dependency audit
        run: npm audit --audit-level=high
  agent:
    name: Mission Engine Autonomous Agent
    needs: [precheck, build, mission-engine-auth]
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'autonomous' || inputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout GGA target
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          persist-credentials: true
      - name: Checkout Mission Engine
        uses: actions/checkout@v4
        with:
          repository: serafinwojciech272-stack/global-cue-sports-agent
          ref: main
          token: ${{ secrets.MISSION_ENGINE_TOKEN }}
          path: .mission-engine
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .mission-engine/package-lock.json
      - name: Install Mission Engine
        working-directory: .mission-engine
        run: npm ci
      - name: Mission Engine identity
        working-directory: .mission-engine
        env:
          GCS_PROJECT_ID: gastro-growth-advisor
          GCS_TARGET_ROOT: ${{ github.workspace }}
          GCS_STATE_DIR: ${{ github.workspace }}/.gga/mission
          GCS_ROADMAP_FILE: ${{ github.workspace }}/.gga/mission/roadmap.json
          GCS_CONTROL_PLANE_STAGE: 4
        run: |
          npm run status
          npm run next
          npm run plan
      - name: Execute Mission Engine cycle
        working-directory: .mission-engine
        env:
          GCS_PROJECT_ID: gastro-growth-advisor
          GCS_TARGET_ROOT: ${{ github.workspace }}
          GCS_STATE_DIR: ${{ github.workspace }}/.gga/mission
          GCS_ROADMAP_FILE: ${{ github.workspace }}/.gga/mission/roadmap.json
          GCS_CONTROL_PLANE_STAGE: 4
          GGA_STAGE: ${{ inputs.stage || '' }}
          GGA_FORCE: ${{ inputs.force || false }}
        run: npm run control-plane:cycle
      - name: Revalidate target
        run: |
          npx tsc -b --pretty false
          npm run lint
          npm run build
      - name: Git safety gate
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\..*)$' | grep -vE '\.env\.example$'; then exit 1; fi
          if git diff --name-only | grep -E '(^|/)(node_modules|\.next|dist|build)(/|$)'; then exit 1; fi
          git diff --check
      - name: Commit Mission Engine changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo 'No target changes produced by Mission Engine.'; exit 0; fi
          git config user.name 'gga-mission-engine[bot]'
          git config user.email 'gga-mission-engine@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "feat: autonomous Mission Engine cycle"
          git push origin HEAD:main
  final-gate:
    name: Final Gate
    needs: [mission-engine-auth, precheck, build, agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Final summary
        shell: bash
        run: |
          {
            echo '# GGA AUTONOMOUS CYCLE'
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Auth gate: ${{ needs.mission-engine-auth.result }}"
            echo "Build job: ${{ needs.build.result }}"
            echo "Mission Engine job: ${{ needs.agent.result }}"
            echo "Recovery attempts limit: $MAX_AUTO_RECOVERY_ATTEMPTS"
            if [ '${{ needs.mission-engine-auth.result }}' = 'success' ] && [ '${{ needs.build.result }}' = 'success' ] && [ '${{ needs.agent.result }}' = 'success' ]; then echo 'Result: SUCCESS'; else echo 'Result: FAILURE'; exit 1; fi
          } >> "$GITHUB_STEP_SUMMARY"
