name: Website Builder Sandbox Build
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Generated website project id
        required: true
        type: string
      callback_url:
        description: Supabase executor callback endpoint
        required: true
        type: string
      build_ref:
        description: Git ref to build
        required: true
        default: main
        type: string
permissions:
  contents: read
jobs:
  sandbox-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout generated repository
        uses: actions/checkout@v4
        with:
          ref: \${{ inputs.build_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Collect build result
        if: always()
        env:
          PROJECT_ID: \${{ inputs.project_id }}
          CALLBACK_URL: \${{ inputs.callback_url }}
          BUILD_OUTCOME: \${{ steps.build.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" = "success" ]; then STATUS=verified; else STATUS=failed; fi
          curl --fail-with-body --max-time 20 -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Website-Builder-Executor: github-actions" \
            --data "{\"project_id\":\"$PROJECT_ID\",\"status\":\"$STATUS\"}"
