name: GGA Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Block client-side OpenRouter secrets
        shell: bash
        run: |
          if git grep -n -E 'VITE_OPENROUTER_API_KEY|VITE_.*OPENROUTER.*KEY' -- ':!docs/*'; then
            echo 'Client-side OpenRouter secrets are forbidden.'
            exit 1
          fi

      - name: Block committed environment secrets
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\..*)$' | grep -vE '\.env\.example$'; then
            echo 'Committed environment files are forbidden.'
            exit 1
          fi
